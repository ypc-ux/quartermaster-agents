name: Quartermaster Agents

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  twitter-agent:
    runs-on: ubuntu-latest
    env:
      # Draft mode is the default. Set to false only after the owner opts in.
      TWITTER_DRAFT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r twitter-agent/requirements.txt
      - run: python twitter-agent/scripts/twitter_agent.py
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}

  content-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python content-agent/scripts/content_agent.py twitter 20
      - run: python content-agent/scripts/content_agent.py email 5

  inbox-agent:
    # Julius's email command loop. Skips gracefully if the Resend key is
    # sending-only or the inbox env is missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python inbox-agent/scripts/inbox_agent.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INBOX_OWNER_EMAIL: ${{ secrets.INBOX_OWNER_EMAIL }}
          INBOX_ADDRESS: ${{ secrets.INBOX_ADDRESS }}

  persist:
    # Always run so generated queues are saved even if a prior job failed.
    needs: [twitter-agent, content-agent, inbox-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit generated queues back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f twitter-agent/queue.json \
                     content-agent/content_queue_twitter.json \
                     content-agent/content_queue_email.json \
                     inbox-agent/processed.json \
                     research-agent/inbox || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(agents): persist generated queues"
            git push
          fi

      - name: Notify failure to Slack
        if: failure()
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              --data '{"text":"⚠️ Quartermaster Agents workflow failed. Check the Actions tab."}'
          else
            echo "SLACK_WEBHOOK_URL not set — skipping alert"
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
